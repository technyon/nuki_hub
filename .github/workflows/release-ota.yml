name: NukiHub Release OTA
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to OTA'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  ota:
    name: Publish release to OTA
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Find the release build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=`gh api "repos/${{ github.repository }}/commits/${TAG}" --jq '.sha'`
          RUN=`gh api "repos/${{ github.repository }}/actions/workflows/release.yml/runs?head_sha=${SHA}&event=workflow_dispatch&per_page=1" --jq '.workflow_runs[0] | "\(.id) \(.run_number) \(.run_attempt) \(.created_at[0:10])"'`

          if [ -z "$RUN" ] || [ "$RUN" = "null null null null" ]; then
            echo "::error::No release workflow run found for ${TAG} (${SHA})"
            exit 1
          fi

          read ID NUMBER ATTEMPT DATE <<< "$RUN"
          echo "Release ${TAG} was built by run ${ID} on ${DATE}"
          echo "id=${ID}" >> $GITHUB_OUTPUT
          echo "version=${ID}.${NUMBER}.${ATTEMPT}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT
      - name: Git Checkout
        uses: actions/checkout@v6
        with:
          ref: binary
      - name: Git Checkout release
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
          path: master
          sparse-checkout: |
              resources/ota_manifest.py
              resources/old_manifest.py
              src/Config.h
      - name: Git Commands
        run: |
          git checkout --orphan newBinary
          git branch -D binary
          git branch -M binary
          git rm --cached --ignore-unmatch -r *
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: release
          pattern: '*-release-assets'
          run-id: ${{ steps.build.outputs.id }}
          github-token: ${{ github.token }}
      - name: Copy binaries to ota and remove beta
        env:
          Version: ${{ steps.build.outputs.version }}
          BuildDate: ${{ steps.build.outputs.date }}
        run: |
          mkdir -p ota/beta/
          mkdir -p ota/master/
          mkdir -p ota/old/
          mkdir -p resources/
          mkdir -p src/
          cp -vf release/*/nuki_hub_*.bin ota/
          cp -vf release/*/nuki_hub_*.elf ota/
          cp -vf master/resources/ota_manifest.py resources/ota_manifest.py
          cp -vf master/resources/old_manifest.py resources/old_manifest.py
          cp -vf master/src/Config.h src/Config.h
          echo release/*/nuki_hub_*.bin | tr ' ' '\n' | xargs -n1 -I{} bash -c 'cp {} ota/old/${TAG}.$(basename "{}")'
          python3 resources/ota_manifest.py release $Version $BuildDate
          python3 resources/ota_manifest.py beta none
          python3 resources/old_manifest.py ${TAG}
          find * -not -path "ota*" -delete
          rm -rf ota/beta/*.bin
          rm -rf ota/beta/*.elf
          rm -rf .github .gitignore .gitmodules
          touch ota/beta/empty
          touch ota/master/empty
      - name: Commit binaries to binary
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update binaries"
          file_pattern: 'ota/* ota/master/* ota/beta/* ota/old/*'
          branch: binary
          skip_dirty_check: true
          skip_fetch: true
          skip_checkout: true
          disable_globbing: true
          add_options: '-f'
          push_options: '-f'
